name: Build And Release Debian Package

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: release-deb
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      skip_build: ${{ steps.release_check.outputs.skip_build }}
      codex_app_version: ${{ steps.collect_metadata.outputs.codex_app_version }}
      codex_build_number: ${{ steps.collect_metadata.outputs.codex_build_number }}
      electron_version: ${{ steps.collect_metadata.outputs.electron_version }}
      release_tag: ${{ steps.collect_metadata.outputs.release_tag }}
      release_name: ${{ steps.collect_metadata.outputs.release_name }}
      release_stamp: ${{ steps.collect_metadata.outputs.release_stamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            python3 \
            rustc \
            cargo \
            tar \
            unzip \
            xz-utils

      - name: Build Linux app from latest DMG
        env:
          CODEX_FORCE_DOWNLOADED_7ZIP: "1"
          npm_config_python: /usr/bin/python3
        run: |
          rm -f Codex.dmg
          chmod +x install.sh
          ./install.sh

      - name: Upload latest DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-dmg
          path: Codex.dmg

      - name: Collect release metadata
        id: collect_metadata
        run: |
          meta_dir="$(mktemp -d)"
          (
            cd "$meta_dir"
            npx --yes asar extract-file "$GITHUB_WORKSPACE/codex-app/resources/app.asar" package.json
          )

          codex_app_version="$(node -p "require('$meta_dir/package.json').version")"
          codex_build_number="$(node -p "require('$meta_dir/package.json').codexBuildNumber || ''")"
          electron_version="$(tr -d '\n' < codex-app/version)"
          release_stamp="$(date -u +%Y.%m.%d.%H%M%S)"
          release_tag="release-${release_stamp}"
          release_name="Codex Desktop Linux ${release_stamp}"

          {
            echo "codex_app_version=$codex_app_version"
            echo "codex_build_number=$codex_build_number"
            echo "electron_version=$electron_version"
            echo "release_tag=$release_tag"
            echo "release_name=$release_name"
            echo "release_stamp=$release_stamp"
          } >> "$GITHUB_OUTPUT"

      - name: Skip scheduled rebuild when release exists
        id: release_check
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.collect_metadata.outputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GITHUB_TOKEN"]
          output_path = os.environ["GITHUB_OUTPUT"]

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
              },
          )

          try:
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  with open(output_path, "a", encoding="utf-8") as handle:
                      handle.write("skip_build=false\n")
                  raise SystemExit(0)
              raise

          print(f"Release already exists for {tag}: {payload.get('html_url', 'unknown url')}")
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write("skip_build=true\n")
          PY

      - name: Generate release notes
        if: github.event_name != 'schedule' || steps.release_check.outputs.skip_build != 'true'
        env:
          CODEX_APP_VERSION: ${{ steps.collect_metadata.outputs.codex_app_version }}
          CODEX_BUILD_NUMBER: ${{ steps.collect_metadata.outputs.codex_build_number }}
          ELECTRON_VERSION: ${{ steps.collect_metadata.outputs.electron_version }}
          RELEASE_TAG: ${{ steps.collect_metadata.outputs.release_tag }}
          RELEASE_STAMP: ${{ steps.collect_metadata.outputs.release_stamp }}
        run: |
          {
            echo "# ${RELEASE_STAMP}"
            echo
            echo "- Codex Desktop: ${CODEX_APP_VERSION}"
            if [ -n "$CODEX_BUILD_NUMBER" ]; then
              echo "- Build number: ${CODEX_BUILD_NUMBER}"
            fi
            echo "- Electron: ${ELECTRON_VERSION}"
            echo "- Artifacts:"
            echo "  - codex-desktop_${RELEASE_STAMP}_amd64_ubuntu20.04.deb"
            echo "  - codex-desktop_${RELEASE_STAMP}_amd64_ubuntu22.04.deb"
            echo "  - codex-desktop_${RELEASE_STAMP}_amd64_ubuntu24.04.deb"
          } > release-notes.md

      - name: Upload release notes artifact
        if: github.event_name != 'schedule' || steps.release_check.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-release:
    needs: prepare-release
    if: github.event_name != 'schedule' || needs.prepare-release.outputs.skip_build != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version:
          - "20.04"
          - "22.04"
          - "24.04"
    container:
      image: ubuntu:${{ matrix.ubuntu_version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt_retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              sleep $((attempt * 10))
            done
          }

          if [ "${{ matrix.ubuntu_version }}" = "20.04" ]; then
            sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          fi

          apt_retry apt-get update
          apt_retry apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            sudo \
            p7zip-full \
            python3 \
            tar \
            unzip \
            xz-utils

          case "$(uname -m)" in
            x86_64) sevenzip_arch="x64" ;;
            aarch64) sevenzip_arch="arm64" ;;
            *)
              echo "Unsupported CI arch for 7zz bootstrap: $(uname -m)" >&2
              exit 1
              ;;
          esac

          curl -fL "https://www.7-zip.org/a/7z2600-linux-${sevenzip_arch}.tar.xz" -o /tmp/7z.tar.xz
          tar -C /tmp -xf /tmp/7z.tar.xz 7zz
          install -m 755 /tmp/7zz /usr/local/bin/7zz

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

          if [ "${{ matrix.ubuntu_version }}" = "20.04" ]; then
            apt_retry apt-get install -y software-properties-common
            add-apt-repository -y ppa:ubuntu-toolchain-r/test
            apt_retry apt-get update
            apt_retry apt-get install -y gcc-11 g++-11 binutils
            printf '%s\n' \
              '#include <compare>' \
              '#include <concepts>' \
              '#include <ranges>' \
              '#include <source_location>' \
              'int main(){static_assert(std::three_way_comparable_with<int,int>);auto order=(1 <=> 2);auto v=std::views::iota(0,3);auto loc=std::source_location::current();return (order < 0 && *v.begin()==0 && loc.line()>0) ? 0 : 1;}' \
              | g++-11 -std=gnu++20 -x c++ - -o /tmp/codex-ci-toolchain-check
          fi

      - name: Download latest DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-dmg
          path: downloaded-dmg

      - name: Build Linux app from downloaded DMG
        env:
          npm_config_python: /usr/bin/python3
          CODEX_FORCE_DOWNLOADED_7ZIP: "1"
          CODEX_FORCE_SOURCE_NATIVE_MODULES: ${{ matrix.ubuntu_version == '20.04' && '1' || '0' }}
        run: |
          if [ "${{ matrix.ubuntu_version }}" = "20.04" ]; then
            export CC=gcc-11
            export CXX=g++-11
            export npm_config_cc=gcc-11
            export npm_config_cxx=g++-11
          fi
          cp downloaded-dmg/Codex.dmg ./Codex.dmg
          chmod +x install.sh
          ./install.sh

      - name: Verify Ubuntu 20.04 ABI floor
        if: matrix.ubuntu_version == '20.04'
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          allowed = (2, 31)
          required_targets = [
              pathlib.Path('codex-app/electron'),
              pathlib.Path('codex-app/resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node'),
              pathlib.Path('codex-app/resources/app.asar.unpacked/node_modules/node-pty/build/Release/pty.node'),
          ]
          optional_targets = [
              pathlib.Path('codex-app/lib/libgcc_s.so.1'),
              pathlib.Path('codex-app/lib/libstdc++.so.6'),
          ]
          pattern = re.compile(r'GLIBC_(\d+)\.(\d+)')
          failures = []

          for target in required_targets:
              if not target.exists():
                  failures.append(f'missing expected file: {target}')
                  continue
              output = subprocess.run(
                  ['objdump', '-T', str(target)],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              versions = {
                  (int(m.group(1)), int(m.group(2)))
                  for m in pattern.finditer(output)
              }
              bad = sorted(v for v in versions if v > allowed)
              if bad:
                  failures.append(
                      f'{target} requires newer GLIBC symbols: ' + ', '.join(f'{major}.{minor}' for major, minor in bad)
                  )

          for target in optional_targets:
              if not target.exists():
                  continue
              output = subprocess.run(
                  ['objdump', '-T', str(target)],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              versions = {
                  (int(m.group(1)), int(m.group(2)))
                  for m in pattern.finditer(output)
              }
              bad = sorted(v for v in versions if v > allowed)
              if bad:
                  failures.append(
                      f'{target} requires newer GLIBC symbols: ' + ', '.join(f'{major}.{minor}' for major, minor in bad)
                  )

          if failures:
              print('\n'.join(failures), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Build Debian package
        run: |
          if [ "${{ matrix.ubuntu_version }}" = "20.04" ]; then
            export CC=gcc-11
            export CXX=g++-11
            export npm_config_cc=gcc-11
            export npm_config_cxx=g++-11
          fi
          ./scripts/build-deb.sh

      - name: Rename Debian package for release
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu_version }}
          RELEASE_STAMP: ${{ needs.prepare-release.outputs.release_stamp }}
        run: |
          deb_source="$(find dist -maxdepth 1 -type f -name 'codex-desktop_*.deb' | head -n 1)"
          release_dir="dist/release"
          deb_release_path="${release_dir}/codex-desktop_${RELEASE_STAMP}_amd64_ubuntu${UBUNTU_VERSION}.deb"
          mkdir -p "$release_dir"
          cp "$deb_source" "$deb_release_path"
          echo "DEB_RELEASE_PATH=$deb_release_path" >> "$GITHUB_ENV"

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-desktop-ubuntu${{ matrix.ubuntu_version }}-deb
          path: ${{ env.DEB_RELEASE_PATH }}

  publish-release:
    needs:
      - prepare-release
      - build-release
    if: github.event_name != 'schedule' || needs.prepare-release.outputs.skip_build != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Download Debian artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: codex-desktop-ubuntu*-deb
          merge-multiple: true

      - name: Download release notes artifact
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          body_path: release-notes/release-notes.md
          files: release-assets/*
          overwrite_files: true
